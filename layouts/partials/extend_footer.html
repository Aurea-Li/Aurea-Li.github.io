<script>
(() => {
  const selector = '.post-content img';
  const ignoredSelector = '.no-lightbox';
  const overlay = document.createElement('div');
  overlay.className = 'image-lightbox';
  overlay.setAttribute('aria-hidden', 'true');
  overlay.innerHTML = '<img class="image-lightbox__img" alt="">';
  document.body.appendChild(overlay);

  const overlayImg = overlay.querySelector('.image-lightbox__img');
  let activeImages = [];
  let activeIndex = -1;
  let closeTimer;

  const close = () => {
    overlay.classList.remove('is-open');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('lightbox-open');
    if (closeTimer) {
      window.clearTimeout(closeTimer);
    }
    closeTimer = window.setTimeout(() => {
      overlayImg.src = '';
      overlayImg.alt = '';
    }, 240);
  };

  const getLightboxImages = () => Array.from(document.querySelectorAll(selector))
    .filter((img) => !img.matches(ignoredSelector) && !img.closest('a'));

  const getImageSrc = (img) => img.getAttribute('data-zoom-src') || img.currentSrc || img.src;

  const showAtIndex = (index) => {
    if (!activeImages.length) {
      return;
    }
    activeIndex = (index + activeImages.length) % activeImages.length;
    const img = activeImages[activeIndex];
    overlayImg.src = getImageSrc(img);
    overlayImg.alt = img.alt || '';
  };

  const open = (img) => {
    if (closeTimer) {
      window.clearTimeout(closeTimer);
    }
    activeImages = getLightboxImages();
    activeIndex = activeImages.indexOf(img);
    if (activeIndex === -1) {
      activeImages = [];
      activeIndex = -1;
      overlayImg.src = getImageSrc(img);
      overlayImg.alt = img.alt || '';
    } else {
      showAtIndex(activeIndex);
    }
    overlay.classList.add('is-open');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lightbox-open');
  };

  overlay.addEventListener('click', () => {
    close();
  });

  document.addEventListener('keydown', (event) => {
    if (!overlay.classList.contains('is-open')) {
      return;
    }
    if (event.key === 'Escape') {
      close();
      return;
    }
    if (event.key === 'ArrowRight') {
      event.preventDefault();
      showAtIndex(activeIndex + 1);
      return;
    }
    if (event.key === 'ArrowLeft') {
      event.preventDefault();
      showAtIndex(activeIndex - 1);
    }
  });

  document.addEventListener('click', (event) => {
    const img = event.target.closest(selector);
    if (!img) {
      return;
    }
    if (img.matches(ignoredSelector) || img.closest('a')) {
      return;
    }
    if (overlay.contains(img)) {
      return;
    }
    event.preventDefault();
    open(img);
  });

  const prefetchFirstPost = () => {
    const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (connection && (connection.saveData || /(^(slow-)?3g$)|(^|-)2g/.test(connection.effectiveType || ''))) {
      return;
    }
    const firstLink = document.querySelector('.home .post-list .post-link');
    if (!firstLink || !firstLink.href) {
      return;
    }
    const href = firstLink.href;
    const prefetch = document.createElement('link');
    prefetch.rel = 'prefetch';
    prefetch.as = 'document';
    prefetch.href = href;
    document.head.appendChild(prefetch);

    fetch(href, { credentials: 'same-origin' })
      .then((response) => response.text())
      .then((html) => {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const images = Array.from(doc.querySelectorAll('.post-content img')).slice(0, 2);
        images.forEach((img) => {
          const src = img.getAttribute('data-zoom-src') || img.getAttribute('src');
          if (!src) {
            return;
          }
          const url = new URL(src, href).href;
          const preload = new Image();
          preload.decoding = 'async';
          preload.src = url;
        });
      })
      .catch(() => {});
  };

  window.addEventListener('load', () => {
    // Prefetch the first post and its images after initial render.
    if ('requestIdleCallback' in window) {
      window.requestIdleCallback(prefetchFirstPost, { timeout: 2000 });
    } else {
      window.setTimeout(prefetchFirstPost, 2000);
    }
  });
})();
</script>
